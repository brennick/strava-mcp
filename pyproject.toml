[project]
name = "strava-mcp"
version = "0.1.0"
description = "Remote MCP server exposing a single user's Strava data, designed as a Claude.ai custom connector."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "starlette>=0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
strava-mcp = "strava_mcp.server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
